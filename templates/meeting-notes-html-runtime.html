<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>会议纪要</title>
<style>
:root {
  color-scheme: light;
  --bg:#eef3f8; --bg-grid:rgba(37,99,235,.08); --panel:#ffffff; --panel-2:#f8fbff;
  --ink:#152033; --muted:#667085; --line:#d8e2ee; --accent:#0ea5a3;
  --accent-2:#7c3aed; --danger:#b42318; --shadow:0 16px 50px rgba(21,32,51,.10); --chip:#ecfeff;
}
body[data-theme="dark"] {
  color-scheme: dark;
  --bg:#08111f; --bg-grid:rgba(45,212,191,.10); --panel:#101a2b; --panel-2:#0d1626;
  --ink:#e6edf7; --muted:#9fb0c6; --line:#25364d; --accent:#2dd4bf;
  --accent-2:#a78bfa; --danger:#fb7185; --shadow:0 18px 60px rgba(0,0,0,.42); --chip:#102f35;
}
* { box-sizing:border-box; }
html { scroll-behavior:smooth; }
body {
  margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif;
  color:var(--ink); background:var(--bg); line-height:1.66; letter-spacing:0;
}
body::before {
  content:""; position:fixed; inset:0; pointer-events:none;
  background-image:linear-gradient(var(--bg-grid) 1px, transparent 1px), linear-gradient(90deg, var(--bg-grid) 1px, transparent 1px);
  background-size:28px 28px; mask-image:linear-gradient(to bottom, rgba(0,0,0,.9), transparent 72%);
}
.toolbar { position:sticky; top:0; z-index:10; backdrop-filter:blur(16px); background:color-mix(in srgb, var(--bg) 78%, transparent); border-bottom:1px solid var(--line); }
.toolbar-inner { max-width:1180px; margin:0 auto; padding:10px 18px; display:flex; align-items:center; justify-content:space-between; gap:14px; }
.brand { display:flex; align-items:center; gap:10px; min-width:180px; font-weight:700; }
.pulse { width:10px; height:10px; border-radius:50%; background:var(--accent); box-shadow:0 0 0 5px color-mix(in srgb, var(--accent) 20%, transparent), 0 0 18px var(--accent); }
.anchor-nav { display:flex; gap:8px; overflow:auto; padding:3px; scrollbar-width:none; }
.anchor-nav a, .control-btn { border:1px solid var(--line); color:var(--ink); background:color-mix(in srgb, var(--panel) 88%, transparent); text-decoration:none; border-radius:999px; padding:7px 12px; font-size:14px; white-space:nowrap; cursor:pointer; }
.anchor-nav a:hover, .control-btn:hover { border-color:var(--accent); box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 14%, transparent); }
.controls { display:flex; gap:8px; align-items:center; }
.page { max-width:1180px; margin:0 auto; padding:24px 18px 64px; }
.report { border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow); background:linear-gradient(180deg, color-mix(in srgb, var(--panel) 94%, transparent), var(--panel)); overflow:hidden; }
.hero { position:relative; padding:30px; background:linear-gradient(135deg, color-mix(in srgb, var(--accent) 15%, var(--panel)), color-mix(in srgb, var(--accent-2) 10%, var(--panel))); border-bottom:1px solid var(--line); }
.hero::after { content:"AI MEETING NOTES"; position:absolute; right:26px; top:18px; color:color-mix(in srgb, var(--muted) 30%, transparent); font-size:12px; letter-spacing:2px; }
h1 { margin:0 0 12px; font-size:30px; line-height:1.22; letter-spacing:0; }
.summary { margin:14px 0 0; color:var(--muted); max-width:920px; }
.meta { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; margin-top:20px; }
.meta-card, .stat, .section, .topic-card { background:color-mix(in srgb, var(--panel) 86%, transparent); border:1px solid var(--line); border-radius:10px; }
.meta-card { padding:13px; }
.label { display:block; color:var(--muted); font-size:13px; margin-bottom:4px; }
.stats { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px; padding:18px 22px 4px; }
.stat { padding:16px; position:relative; overflow:hidden; }
.stat::before { content:""; position:absolute; inset:0 0 auto 0; height:2px; background:linear-gradient(90deg,var(--accent),var(--accent-2)); }
.stat b { display:block; color:var(--accent); font-size:28px; }
.content { padding:0 22px 24px; }
.section { padding:22px; margin-top:16px; scroll-margin-top:82px; }
h2 { margin:0 0 14px; font-size:20px; display:flex; align-items:center; gap:10px; }
h2::before { content:""; width:9px; height:22px; border-radius:999px; background:linear-gradient(180deg,var(--accent),var(--accent-2)); box-shadow:0 0 16px color-mix(in srgb, var(--accent) 35%, transparent); }
.topic-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; }
.topic-card { padding:16px; }
.topic-card strong { display:block; margin-bottom:6px; }
.table-wrap { overflow-x:auto; border:1px solid var(--line); border-radius:8px; }
table { width:100%; border-collapse:collapse; min-width:760px; background:var(--panel); }
th,td { border-bottom:1px solid var(--line); border-right:1px solid var(--line); padding:10px 12px; vertical-align:top; text-align:left; }
th:last-child,td:last-child { border-right:0; }
tr:last-child td { border-bottom:0; }
th { background:color-mix(in srgb, var(--accent) 12%, var(--panel)); color:var(--ink); font-weight:700; }
ul { margin:8px 0 0 20px; padding:0; }
.footer-note { padding:0 22px 24px; color:var(--muted); font-size:13px; }
@media (max-width:880px) {
  .toolbar-inner { align-items:flex-start; flex-direction:column; }
  .anchor-nav { width:100%; }
  .meta,.stats,.topic-grid { grid-template-columns:1fr; }
  h1 { font-size:24px; }
  .hero,.section { padding:18px; }
  .content { padding:0 14px 18px; }
}
@media print {
  .toolbar { display:none; }
  body { background:white; }
  body::before { display:none; }
  .page { padding:0; }
  .report,.section,.meta-card,.stat { box-shadow:none; }
  .section { break-inside:avoid; }
}
</style>
</head>
<body data-theme="light">
<header class="toolbar" aria-label="页面工具栏">
  <div class="toolbar-inner">
    <div class="brand"><span class="pulse"></span><span>PM Meeting Notes</span></div>
    <nav class="anchor-nav" aria-label="会议纪要目录">
      <a href="#topics">核心讨论</a>
      <a href="#decisions">关键决策</a>
      <a href="#risks">问题风险</a>
      <a href="#actions">行动项</a>
      <a href="#questions">待确认问题</a>
    </nav>
    <div class="controls">
      <button class="control-btn" id="themeBtn" type="button">暗黑模式</button>
      <button class="control-btn" id="exportBtn" type="button">保存为图片</button>
    </div>
  </div>
</header>
<main class="page">
  <article class="report" id="captureArea">
    <section class="hero">
      <h1>会议纪要标题</h1>
      <p class="summary">这里替换为会议结论摘要。</p>
      <div class="meta">
        <div class="meta-card"><span class="label">会议时间</span>未明确</div>
        <div class="meta-card"><span class="label">参会人员</span>未明确</div>
        <div class="meta-card"><span class="label">会议性质</span>未明确</div>
      </div>
    </section>
    <section class="stats" aria-label="纪要统计">
      <div class="stat"><span class="label">关键共识</span><b>0</b></div>
      <div class="stat"><span class="label">风险问题</span><b>0</b></div>
      <div class="stat"><span class="label">行动项</span><b>0</b></div>
      <div class="stat"><span class="label">待确认</span><b>0</b></div>
    </section>
    <div class="content">
      <section id="topics" class="section"><h2>核心讨论内容</h2></section>
      <section id="decisions" class="section"><h2>关键决策与共识</h2></section>
      <section id="risks" class="section"><h2>问题、风险与阻塞</h2></section>
      <section id="actions" class="section"><h2>行动项</h2></section>
      <section id="questions" class="section"><h2>待确认问题</h2></section>
    </div>
    <p class="footer-note">信息边界：未在原始材料中明确的责任人、日期和结论均保留为未明确、未提及或需确认。</p>
  </article>
</main>
<script>
const body = document.body;
const themeBtn = document.getElementById('themeBtn');
const exportBtn = document.getElementById('exportBtn');

function setTheme(theme) {
  body.dataset.theme = theme;
  themeBtn.textContent = theme === 'dark' ? '亮色模式' : '暗黑模式';
  try { localStorage.setItem('pmMeetingNotesTheme', theme); } catch (error) {}
}

try {
  setTheme(localStorage.getItem('pmMeetingNotesTheme') || 'light');
} catch (error) {
  setTheme('light');
}

themeBtn.addEventListener('click', () => setTheme(body.dataset.theme === 'dark' ? 'light' : 'dark'));

function downloadBlob(blob, filename) {
  const blobUrl = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.download = filename;
  link.href = blobUrl;
  document.body.appendChild(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(blobUrl), 1000);
}

async function exportReportImage() {
  const target = document.getElementById('captureArea');
  const width = Math.ceil(target.scrollWidth);
  const height = Math.ceil(target.scrollHeight);
  const computed = getComputedStyle(body);
  const clone = target.cloneNode(true);
  clone.setAttribute('xmlns', 'http://www.w3.org/1999/xhtml');
  clone.style.width = width + 'px';
  clone.style.margin = '0';
  ['--bg','--bg-grid','--panel','--panel-2','--ink','--muted','--line','--accent','--accent-2','--danger','--shadow','--chip']
    .forEach(name => clone.style.setProperty(name, computed.getPropertyValue(name)));
  const styles = Array.from(document.querySelectorAll('style')).map(s => s.textContent).join('\n');
  const theme = body.dataset.theme;
  const xhtml = `<div xmlns="http://www.w3.org/1999/xhtml" data-theme="${theme}" style="background:${computed.getPropertyValue('--bg')};color:${computed.getPropertyValue('--ink')};font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif;"><style>${styles}</style><div style="background:var(--bg);padding:24px;">${clone.outerHTML}</div></div>`;
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${width + 48}" height="${height + 48}"><foreignObject width="100%" height="100%">${xhtml}</foreignObject></svg>`;
  const svgBlob = new Blob([svg], { type: 'image/svg+xml;charset=utf-8' });
  const url = URL.createObjectURL(svgBlob);
  const img = new Image();
  img.src = url;
  try {
    await img.decode();
    const scale = Math.min(2, Math.max(1, window.devicePixelRatio || 1));
    const canvas = document.createElement('canvas');
    canvas.width = Math.round((width + 48) * scale);
    canvas.height = Math.round((height + 48) * scale);
    const ctx = canvas.getContext('2d');
    ctx.scale(scale, scale);
    ctx.drawImage(img, 0, 0);
    URL.revokeObjectURL(url);
    await new Promise(resolve => canvas.toBlob(blob => {
      if (blob) downloadBlob(blob, 'meeting-notes.png');
      resolve();
    }, 'image/png'));
  } catch (error) {
    URL.revokeObjectURL(url);
    downloadBlob(svgBlob, 'meeting-notes.svg');
    alert('当前浏览器未允许直接导出 PNG，已自动保存为 SVG 图片。也可以使用浏览器截图或打印为 PDF 作为备用方案。');
  }
}

exportBtn.addEventListener('click', exportReportImage);
</script>
</body>
</html>
